[package]
name = "rsmalloc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
rayon = "1"

[dependencies.rsmalloc]
path = ".."

[[bin]]
name = "alloc_ops"
path = "fuzz_targets/alloc_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "concurrent_alloc_ops"
path = "fuzz_targets/concurrent_alloc_ops.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 2
