[package]
name = "rsmalloc"
description = "An experimental RSEQ-based general-purpose memory allocator written in Rust"
license = "MIT"
version = "0.2.0-alpha"
readme = "README.md"
repository = "https://github.com/Metehan120/rsmalloc"
edition = "2024"

[dependencies]
rustix = { version = "1.1.4", features = [
    "linux_latest",
    "mm",
    "rand",
    "system",
    "fs",
] }
# libc used for NUMA policy and will be changed in future
libc = "0.2.186"

[features]
default = ["rseq-thread-failure-fallback"]
preload = []
debug-print = ["debug"]
debug = []
debug-exact = ["debug", "debug-print"]
debug-predictor-exact = ["debug", "debug-print"]
predictor-debug = []
extended-header = []
rseq-thread-failure-fallback = []
lazy-page-trim = []

[[bench]]
name = "book_speed"
harness = false

[[bench]]
name = "rstress"
harness = false

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"

[lib]
name = "rsmalloc"
crate-type = ["cdylib", "rlib"]
doctest = false

[profile.release]
opt-level = 3
panic = "abort"
overflow-checks = false
lto = "fat"
codegen-units = 1
