[package]
name = "rsmalloc"
description = "An RSEQ-based general-purpose memory allocator written in Rust"
license = "MIT"
version = "0.3.0-alpha"
readme = "README.md"
repository = "https://github.com/Metehan120/rsmalloc"
edition = "2024"

[dependencies]
syscalls = { version = "0.8.1", default-features = false }
rustix = { version = "1.1.4", features = [
    "linux_latest",
    "mm",
    "rand",
    "system",
    "fs",
    "thread",
] }
rsmalloc-macro = { path = "./rsmalloc-macro" }
portable-atomic = "1"

[features]
default = []
preload = []

print-cpu-on-double-free = []
check-owned-on-alloc = []

# Debug options
debug-print = ["debug"]
debug-printer-thread = ["debug-print"]
debug = []
debug-preload = ["preload", "debug-print"]
debug-exact = ["debug", "debug-print"]
debug-predictor-exact = ["debug", "debug-print"]
predictor-debug = []
transfer-debug = ["debug-exact"]
transfer-debug-exact = ["transfer-debug"]
debug-full = ["transfer-debug-exact"]
debug-full-critic = ["transfer-debug-exact", "debug-predictor-exact"]

extended-header = []
lazy-page-trim = []

# Useful on systems (e.g. CachyOS) that aggressively promote transparent huge pages.
# Can significantly reduce RSS at the cost of higher TLB pressure.
page-backend-no-huge-page = []
# Just advising the kernel to use huge pages,
# trim can break them down to 4kb pages
page-backend-huge-page = []

abort-on-rseq-failure = []
disable-magic-security-checks = []
trim-aggressively = []
explicit-zero = []
# Zeroes 16~64b sized allocations (cryptographic key sized) on free; good for security without big performance penalty
zero-small-on-free = []
# Opportunistically places a PROT_NONE guard page at the last 4KB of every 2MB-aligned block
# (not enforced for allocations that don't fit within one segment); catches some OOB bugs.
# support up to 1mb size classes
guard-pages-thp = []
# Shrinks the guard interval from 2MB to 64KB for denser coverage; fragments page tables more often than guard-pages-thp,
# so only combine with page-backend-huge-page if you're fine losing THP eligibility there
# supports up to 32kb size classes
guard-pages-ignore-thp = ["guard-pages-thp"]
semi-hardened = ["extended-header", "check-owned-on-alloc", "zero-small-on-free", "guard-pages-ignore-thp"]

expose-security-critical-settings = []

[[bench]]
name = "book_speed"
harness = false

[[bench]]
name = "rstress"
harness = false

[[bench]]
name = "rstress_app"
harness = false

[dev-dependencies]
criterion = "0.8.2"
loom = "0.7.2"
rand = "0.10.2"
rusqlite = { version = "=0.40.1", features = ["bundled"] }

[lib]
name = "rsmalloc"
crate-type = ["cdylib", "rlib", "staticlib"]
doctest = false

[profile.release]
opt-level = 3
overflow-checks = false
lto = "fat"
codegen-units = 1
debug = 2
